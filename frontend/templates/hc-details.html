<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Details - HauteCarat</title>
    <link rel="stylesheet" href="../static/css/hautecarat-style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="#" class="logo">HAUTECARAT</a>
            <nav class="nav-links">
                <a href="#" class="nav-link" id="back-btn">Go Back</a>
                <a href="#" class="nav-link" id="logout-btn">Logout</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <h1 class="page-title" id="category-title">Jewelry Details</h1>

        <div id="alert-container"></div>

        <!-- Jewelry Details Form -->
        <section class="details-section">
            <form id="jewelry-form">
                <!-- Input Fields -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="width">Jewelry Width (mm) *</label>
                        <input
                            type="number"
                            id="width"
                            name="width"
                            class="form-input"
                            placeholder="e.g., 2.5"
                            step="0.1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="fit_length">Fit / Length *</label>
                        <input
                            type="text"
                            id="fit_length"
                            name="fit_length"
                            class="form-input"
                            placeholder="e.g., Comfort Fit or 18 inches"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="metal_type">Metal Type *</label>
                        <select id="metal_type" name="metal_type" class="form-select" required>
                            <option value="">Select Metal Type</option>
                            <option value="18K Yellow Gold">18K Yellow Gold</option>
                            <option value="Platinum">Platinum</option>
                            <option value="Rose Gold">Rose Gold</option>
                            <option value="White Gold">White Gold</option>
                        </select>
                    </div>
                </div>

                <!-- Image Upload -->
                <div class="upload-area" id="upload-area">
                    <input
                        type="file"
                        id="image-upload"
                        accept=".jpg,.jpeg,.png"
                        multiple
                        style="display: none;"
                    >
                    <div class="upload-icon">📤</div>
                    <p class="upload-text">
                        <strong>Click to upload</strong> or drag and drop
                    </p>
                    <p class="upload-hint">JPG, JPEG or PNG (Min: 1, Max: 3 images)</p>
                </div>

                <!-- Image Previews -->
                <div class="preview-grid" id="preview-grid"></div>

                <!-- Action Buttons -->
                <div class="flex-buttons">
                    <button type="submit" class="btn btn-primary" id="generate-btn">
                        Generate Jewelry
                    </button>
                </div>
            </form>
        </section>

        <!-- Results Section -->
        <section class="results-section hidden" id="results-section">
            <h2 class="results-title">Generated Results</h2>

            <!-- Generated Image -->
            <div class="result-image-container">
                <img id="generated-image" src="" alt="Generated Jewelry" class="result-image">
                <div class="flex-buttons mt-30">
                    <button class="btn btn-primary" id="download-btn">
                        Download Image
                    </button>
                </div>
            </div>

            <!-- Generated Description -->
            <div class="result-description">
                <h3>Jewelry Description</h3>
                <p id="generated-description"></p>
            </div>
        </section>
    </main>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p class="loading-text">Generating your luxury jewelry...</p>
            <p class="upload-hint" style="margin-top: 10px;">This may take a moment</p>
        </div>
    </div>

    <script src="../static/js/hc-api.js"></script>
    <script src="../static/js/hc-details.js"></script>
</body>
</html>
