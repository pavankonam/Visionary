<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HauteCarat</title>
    <link rel="stylesheet" href="../static/css/hautecarat-style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <h1 class="login-logo">HAUTECARAT</h1>

            <div id="alert-container"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="login-btn">
                    Sign In
                </button>
            </form>
        </div>
    </div>

    <script src="../static/js/hc-api.js"></script>
    <script src="../static/js/hc-login.js"></script>
</body>
</html>
