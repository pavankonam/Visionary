<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Category - HauteCarat</title>
    <link rel="stylesheet" href="../static/css/hautecarat-style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="#" class="logo">HAUTECARAT</a>
            <nav class="nav-links">
                <a href="#" class="nav-link" id="logout-btn">Logout</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <h1 class="page-title">Select Jewelry Category</h1>

        <div id="alert-container"></div>

        <div class="category-grid">
            <div class="category-card" data-category="Earrings">
                <span class="category-icon">💎</span>
                <h3 class="category-title">Earrings</h3>
            </div>

            <div class="category-card" data-category="Rings">
                <span class="category-icon">💍</span>
                <h3 class="category-title">Rings</h3>
            </div>

            <div class="category-card" data-category="Bracelet">
                <span class="category-icon">📿</span>
                <h3 class="category-title">Bracelets</h3>
            </div>

            <div class="category-card" data-category="Necklace">
                <span class="category-icon">👑</span>
                <h3 class="category-title">Necklaces</h3>
            </div>
        </div>
    </main>

    <script src="../static/js/hc-api.js"></script>
    <script src="../static/js/hc-category.js"></script>
</body>
</html>
